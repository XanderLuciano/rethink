<!doctype html>
<html>
    <head>
        <style>
            .state-card {
                border: 1px solid #e0e0e0;
                border-radius: 8px;
                padding: 12px 16px;
                margin: 4px 0;
            }
            .state-card .card-header {
                display: flex;
                align-items: center;
                gap: 8px;
                font-weight: 600;
                margin-bottom: 4px;
            }
            .state-card .card-header .material-icons {
                color: #0288d1;
            }
            .state-card .card-value {
                font-size: 1.5em;
                font-weight: 700;
                color: #e65100;
            }
            .state-card .card-sub {
                font-size: 0.85em;
                color: #888;
            }
            .toggle-btn {
                border: none;
                border-radius: 4px;
                padding: 6px 18px;
                font-weight: 600;
                cursor: pointer;
                font-size: 0.9em;
            }
            .toggle-btn.on {
                background: #4caf50;
                color: #fff;
            }
            .toggle-btn.off {
                background: #bdbdbd;
                color: #555;
            }
            .toggle-btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }
            .signal-row {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 2px 0;
                font-size: 0.9em;
            }
            .signal-row .material-icons {
                font-size: 1.1em;
                color: #0288d1;
            }
            .raw-log {
                max-height: 300px;
                overflow-y: auto;
                font-family: 'Courier New', monospace;
                font-size: 0.75em;
                background: #f5f5f5;
                border: 1px solid #ddd;
                border-radius: 4px;
                padding: 8px;
                margin-top: 8px;
            }
            .raw-log .msg {
                margin: 1px 0;
                word-break: break-all;
                line-height: 1.4;
                white-space: pre-wrap;
            }
            .raw-log .msg.rx {
                color: #1565c0;
            }
            .raw-log .msg.tx {
                color: #c62828;
            }
            .raw-log .dir {
                font-weight: 700;
                margin-right: 6px;
            }
            .raw-log .time {
                color: #999;
                margin-right: 8px;
            }
        </style>
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    </head>
    <body>
        <nav class="light-blue lighten-1" role="navigation">
            <div class="nav-wrapper container">
                <a href="/" class="brand-logo">
                    <span class="material-icons">psychology_alt</span>
                    Rethink monitor
                </a>
            </div>
        </nav>

        <div class="container">
            <h4 class="header orange-text" id="dev_title">Device</h4>

            <!-- Device info -->
            <div class="row" id="info_row">
                <div class="col s12 m6">
                    <table>
                        <tr>
                            <td style="font-weight: 600; width: 7em">Model</td>
                            <td id="info_model">...</td>
                        </tr>
                        <tr>
                            <td style="font-weight: 600">Type</td>
                            <td id="info_type">...</td>
                        </tr>
                        <tr>
                            <td style="font-weight: 600">Status</td>
                            <td id="info_status">...</td>
                        </tr>
                    </table>
                </div>
                <div class="col s12 m6">
                    <table>
                        <tr>
                            <td style="font-weight: 600; width: 5em">RSSI</td>
                            <td id="info_rssi">...</td>
                        </tr>
                        <tr>
                            <td style="font-weight: 600">Packets</td>
                            <td id="info_packets">0</td>
                        </tr>
                        <tr>
                            <td style="font-weight: 600">Last seen</td>
                            <td id="info_seen">...</td>
                        </tr>
                    </table>
                </div>
            </div>

            <!-- Status cards -->
            <div class="row" id="status_cards"></div>

            <!-- Controls (microwave: fan/light) -->
            <div id="controls_section" style="display: none">
                <h5 class="header orange-text">Controls</h5>
                <div class="row" id="controls_row"></div>
            </div>

            <!-- Raw packets -->
            <h5 class="header orange-text">
                Raw Packets
                <span style="float: right; font-weight: 400; font-size: 0.8em; color: #888" id="raw_count">0</span>
            </h5>
            <div class="raw-log" id="raw_log">
                <div style="color: #999; text-align: center; padding: 20px">Waiting for device data...</div>
            </div>
            <div class="row" style="margin-bottom: 0">
                <div class="input-field col s9 m10">
                    <input id="cmd_input" type="text" placeholder="aa0ef043..." />
                    <label for="cmd_input">Send hex command to device</label>
                </div>
                <div class="input-field col s3 m2">
                    <button class="btn waves-effect waves-light" id="btn_send" onclick="sendCmd()" disabled>
                        Send <i class="material-icons right">send</i>
                    </button>
                </div>
            </div>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
        <script src="monitor.js"></script>
    </body>
</html>
